version: '3.8'
services:
  sqldata:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: shop_sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=ShopPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      
  redis:
    image: redis:alpine
    container_name: shop_redis
    ports:
      - "6379:6379"
      
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shop_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      
  mongodb:
    image: mongo:latest
    container_name: shop_mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=querty
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  sql_data:
  mongo_data:
